name: TinyBox Rust homes validation
on:
  push:
    branches: [sayr/rust-homes-validation]
permissions:
  contents: read
concurrency:
  group: tinybox-rust-homes-validation
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tinyhumansai/tinybox
          ref: '7ceaf5c3bdf62928955d00547aa47cd399ba7ba3'
          path: source
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source
          shared-key: tinybox-native-rust-homes
      - name: Reproduce runtime failures on untouched production
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          git rev-parse HEAD > ../evidence/source-base.txt
          git apply --check ../diagnostic/.github/diagnostics/baseline-tests.patch
          git apply ../diagnostic/.github/diagnostics/baseline-tests.patch
          set +e
          cargo test --locked -p tinybox-jail --test toolchain_homes -- --test-threads=1 > ../evidence/baseline-grants.log 2>&1
          grants_exit=$?
          cargo test --locked -p tinybox-module --lib -- unix_toolchain_environment_is_preserved_for_the_shell_child --test-threads=1 > ../evidence/baseline-env.log 2>&1
          env_exit=$?
          set -e
          test "$grants_exit" -ne 0
          test "$env_exit" -ne 0
          grep -Eq 'test result: FAILED\. [0-9]+ passed; [1-9][0-9]* failed;' ../evidence/baseline-grants.log
          grep -Eq 'test result: FAILED\. [0-9]+ passed; [1-9][0-9]* failed;' ../evidence/baseline-env.log
          git apply --reverse ../diagnostic/.github/diagnostics/baseline-tests.patch
      - name: Install frozen candidate patch and verify hashes
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git apply --check ../diagnostic/.github/diagnostics/candidate.patch
          git apply ../diagnostic/.github/diagnostics/candidate.patch
          sha256sum -c ../diagnostic/.github/diagnostics/source-hashes.txt | tee ../evidence/source-hash-check.log
          cp ../diagnostic/.github/diagnostics/source-hashes.txt ../evidence/
          cp ../diagnostic/.github/diagnostics/candidate.patch ../evidence/
          git diff --check
          rustc -vV > ../evidence/rustc-version.txt
      - name: Canonical formatter and Clippy
        working-directory: source
        run: |
          set -euo pipefail
          cargo fmt --all -- --check 2>&1 | tee ../evidence/fmt.log
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee ../evidence/clippy.log
      - name: Canonical build and tests
        working-directory: source
        run: |
          set -euo pipefail
          cargo build --all-targets --all-features 2>&1 | tee ../evidence/build.log
          cargo test --all-features 2>&1 | tee ../evidence/test.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' ../evidence/test.log
      - name: Actual dynamic module Rust homes flow
        working-directory: source
        run: |
          set -euo pipefail
          cargo test --locked -p tinybox-module --test rust_homes_manifest_e2e -- --nocapture --test-threads=1 2>&1 | tee ../evidence/rust-homes-manifest.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' ../evidence/rust-homes-manifest.log
          bash scripts/test-e2e.sh 2>&1 | tee ../evidence/module-package-e2e.log
      - name: Verify exact source after execution
        working-directory: source
        if: always()
        run: sha256sum -c ../diagnostic/.github/diagnostics/source-hashes.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tinybox-native-validation
          path: evidence
          retention-days: 30
  coverage:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tinyhumansai/tinybox
          ref: '7ceaf5c3bdf62928955d00547aa47cd399ba7ba3'
          path: source
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@70b10d055da4af0e46b2f7166e710204993798b3
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source
          shared-key: tinybox-coverage-rust-homes
      - name: Exact candidate per-file coverage
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          git apply ../diagnostic/.github/diagnostics/candidate.patch
          sha256sum -c ../diagnostic/.github/diagnostics/source-hashes.txt
          bash scripts/check-coverage.sh 2>&1 | tee ../evidence/coverage.log
          cp coverage.json ../evidence/
          sha256sum -c ../diagnostic/.github/diagnostics/source-hashes.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tinybox-coverage-validation
          path: |
            evidence
            source/coverage.json
          retention-days: 30
