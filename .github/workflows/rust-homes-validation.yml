name: TinyBox grant scan diagnosis
on:
  push:
    branches: [sayr/rust-homes-validation]
permissions:
  contents: read
concurrency:
  group: tinybox-rust-homes-validation
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tinyhumansai/tinybox
          ref: '39fe22189431bdf787dafce5eea6d7d49d1a00f8'
          path: source
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source
          shared-key: tinybox-native-rust-homes
      - name: Install frozen candidate patch and verify hashes
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          git apply --check ../diagnostic/.github/diagnostics/candidate.patch
          git apply ../diagnostic/.github/diagnostics/candidate.patch
          sha256sum -c ../diagnostic/.github/diagnostics/source-hashes.txt | tee ../evidence/source-hash-check.log
          cp ../diagnostic/.github/diagnostics/source-hashes.txt ../evidence/
          cp ../diagnostic/.github/diagnostics/candidate.patch ../evidence/
          git diff --check
          rustc -vV > ../evidence/rustc-version.txt
      - name: Trace host grant scans in focused compiled-module regression
        working-directory: source
        run: |
          set -euo pipefail
          python3 ../diagnostic/.github/diagnostics/trace-grant-scan.py
          git diff -- crates/tinybox-jail/src/grants/mod.rs crates/tinybox-module/src/tinybus_module/mod.rs > ../evidence/diagnostic-overlay.diff
          cargo test --locked -p tinybox-module --test rust_homes_manifest_e2e -- --nocapture --test-threads=1 2>&1 | tee ../evidence/scan-diagnostic.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tinybox-scan-diagnostic
          path: evidence
          retention-days: 30
